openapi: 3.0.3

info:
  title: Attendance Management API
  version: 1.0.0
  description: |
    Face-recognition attendance pulled from the factory's EasyTime database.
    The /sync endpoints are called by the Ishita HRMS desktop app on the factory PC and are
    authenticated with the X-Sync-Key header (ATTENDANCE_SYNC_KEY), not a user JWT.

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://sme-api.duckdns.org
    description: Production Server

tags:
  - name: Attendance
    description: Attendance read endpoints (ERP users)
  - name: AttendanceSync
    description: Machine-to-machine sync from the factory PC
  - name: Staff
    description: Staff profiles, salary, upad, statement, dashboard (ERP-only data)

security:
  - oauth2: [ ]

paths:
  # -------------------- SYNC (factory PC agent) --------------------
  /api/v1/attendance/sync/punches:
    post:
      operationId: syncAttendancePunches
      tags:
        - AttendanceSync
      summary: Push a batch of punches from EasyTime (duplicates are ignored)
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/syncKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchSyncBatch'
      responses:
        '200':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          description: Missing or wrong sync key

  /api/v1/attendance/sync/employees:
    post:
      operationId: syncAttendanceEmployees
      tags:
        - AttendanceSync
      summary: Push the EasyTime employee list (insert or update by empCode)
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/syncKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSyncBatch'
      responses:
        '200':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          description: Missing or wrong sync key

  /api/v1/attendance/sync/status:
    get:
      operationId: getAttendanceSyncStatus
      tags:
        - AttendanceSync
      summary: Connectivity check for the agent - what the ERP already has
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/syncKeyHeader'
      responses:
        '200':
          description: Current sync state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '401':
          description: Missing or wrong sync key

  # -------------------- READ (ERP users) --------------------
  /api/v1/attendance/daily:
    get:
      operationId: getDailyAttendance
      tags:
        - Attendance
      summary: One row per active employee for a day - first in, last out, status
      description: |
        Active = punched at least once in the 30 days up to this date, so people who left (or were
        never enrolled) don't show up as absent forever. Status ABSENT = active but no punch.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/weeklyOffParam'
      responses:
        '200':
          description: Daily attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyAttendance'

  /api/v1/attendance/punches:
    get:
      operationId: getAttendancePunches
      tags:
        - Attendance
      summary: Raw punches between two dates (inclusive, max 62 days)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: empCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Punches, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendancePunch'

  /api/v1/attendance/monthly:
    get:
      operationId: getMonthlyAttendance
      tags:
        - Attendance
      summary: Monthly register - every active employee x every day of the month
      parameters:
        - $ref: '#/components/parameters/monthParam'
        - $ref: '#/components/parameters/weeklyOffParam'
      responses:
        '200':
          description: Monthly register
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyAttendance'

  /api/v1/attendance/monthly/export:
    get:
      operationId: exportMonthlyAttendance
      tags:
        - Attendance
      summary: Monthly register as an Excel workbook
      parameters:
        - $ref: '#/components/parameters/monthParam'
        - $ref: '#/components/parameters/weeklyOffParam'
      responses:
        '200':
          description: Excel workbook (.xlsx)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/v1/attendance/employees:
    get:
      operationId: getAttendanceEmployees
      tags:
        - Attendance
      summary: Everyone enrolled on the face device, with their latest punch
      responses:
        '200':
          description: Employees, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceEmployee'

  /api/v1/attendance/health:
    get:
      operationId: getAttendanceHealth
      tags:
        - Attendance
      summary: Is the factory PC sending data? (same as sync/status, for signed-in users)
      responses:
        '200':
          description: Current sync state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'

  # ==================== STAFF & PAYROLL (ERP-only data) ====================
  /api/v1/staff/dashboard:
    get:
      operationId: getStaffDashboard
      tags: [ Staff ]
      summary: Attendance and money at a glance for today
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDashboard'

  /api/v1/staff/settings:
    get:
      operationId: getStaffSettings
      tags: [ Staff ]
      summary: Pay-week start and weekly off
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSettings'
    put:
      operationId: updateStaffSettings
      tags: [ Staff ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSettings'
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSettings'

  /api/v1/staff/departments:
    get:
      operationId: getStaffDepartments
      tags: [ Staff ]
      responses:
        '200':
          description: Departments with timings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffDepartment'
    post:
      operationId: createStaffDepartment
      tags: [ Staff ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffDepartmentInput'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDepartment'

  /api/v1/staff/departments/{id}:
    put:
      operationId: updateStaffDepartment
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffDepartmentInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDepartment'
    delete:
      operationId: deleteStaffDepartment
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '204':
          description: Deleted

  /api/v1/staff/employees:
    get:
      operationId: getStaffEmployees
      tags: [ Staff ]
      summary: Employee cards - photo, phone, balance, upad (PagarGuru style)
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Employees by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffSummary'
    post:
      operationId: createStaffEmployee
      tags: [ Staff ]
      summary: Add employee (or fill in the profile of a device employee by code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffProfileInput'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'

  /api/v1/staff/employees/{empCode}:
    get:
      operationId: getStaffEmployee
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      responses:
        '200':
          description: Full profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
    put:
      operationId: updateStaffEmployee
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffProfileInput'
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
    delete:
      operationId: deleteStaffEmployee
      tags: [ Staff ]
      summary: Delete profile (hidden from the ERP; punch history is kept)
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      responses:
        '204':
          description: Deleted

  /api/v1/staff/employees/{empCode}/active:
    put:
      operationId: setStaffEmployeeActive
      tags: [ Staff ]
      summary: Re-activate / de-activate
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - name: active
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'

  /api/v1/staff/employees/{empCode}/photos:
    put:
      operationId: updateStaffPhotos
      tags: [ Staff ]
      summary: Profile and Aadhar photos as data URLs (null = keep, empty = remove)
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPhotosInput'
      responses:
        '204':
          description: Saved

  /api/v1/staff/employees/{empCode}/aadhar-photo:
    get:
      operationId: getStaffAadharPhoto
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      responses:
        '200':
          description: Aadhar photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffImage'

  /api/v1/staff/employees/{empCode}/days:
    get:
      operationId: getStaffDays
      tags: [ Staff ]
      summary: Day-by-day attendance with salary for a range
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - $ref: '#/components/parameters/fromParam'
        - $ref: '#/components/parameters/toParam'
      responses:
        '200':
          description: Days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffDay'

  /api/v1/staff/employees/{empCode}/days/{date}:
    put:
      operationId: adjustStaffDay
      tags: [ Staff ]
      summary: Edit attendance by hand for one day
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - $ref: '#/components/parameters/datePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceAdjustmentInput'
      responses:
        '200':
          description: The recalculated day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDay'
    delete:
      operationId: clearStaffDayAdjustment
      tags: [ Staff ]
      summary: Remove the manual edit and go back to the device punches
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - $ref: '#/components/parameters/datePathParam'
      responses:
        '200':
          description: The recalculated day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDay'

  /api/v1/staff/employees/{empCode}/statement:
    get:
      operationId: getSalaryStatement
      tags: [ Staff ]
      summary: Employeewise attendance + salary detail report for a period
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - $ref: '#/components/parameters/fromParam'
        - $ref: '#/components/parameters/toParam'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryStatement'

  /api/v1/staff/employees/{empCode}/salary-payments:
    get:
      operationId: getSalaryPayments
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      responses:
        '200':
          description: Payments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaryPayment'
    post:
      operationId: createSalaryPayment
      tags: [ Staff ]
      summary: Pagar Didho - settle a period and record what was paid and how
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryPaymentInput'
      responses:
        '200':
          description: Recorded payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryPayment'

  /api/v1/staff/salary-payments/{id}:
    delete:
      operationId: deleteSalaryPayment
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '204':
          description: Deleted

  /api/v1/staff/employees/{empCode}/upads:
    get:
      operationId: getUpads
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      responses:
        '200':
          description: Upad entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Upad'
    post:
      operationId: createUpad
      tags: [ Staff ]
      summary: Add Upad entry (advance given)
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpadInput'
      responses:
        '200':
          description: Recorded upad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upad'

  /api/v1/staff/upads/{id}:
    delete:
      operationId: deleteUpad
      tags: [ Staff ]
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '204':
          description: Deleted

  /api/v1/staff/employees/{empCode}/payment-history:
    get:
      operationId: getPaymentHistory
      tags: [ Staff ]
      summary: Period-wise (by pay mode) salary, loan, loan deduct, paid
      parameters:
        - $ref: '#/components/parameters/empCodePathParam'
        - $ref: '#/components/parameters/fromParam'
        - $ref: '#/components/parameters/toParam'
      responses:
        '200':
          description: History rows, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentHistoryRow'

components:
  securitySchemes:
    oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    empCodePathParam:
      name: empCode
      in: path
      required: true
      schema:
        type: string
    idPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    datePathParam:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    fromParam:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    toParam:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    monthParam:
      name: month
      in: query
      required: true
      description: yyyy-MM
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        example: '2026-10'
    weeklyOffParam:
      name: weeklyOff
      in: query
      required: false
      description: Factory's weekly holiday; a day off with no punch is WEEKLY_OFF, not ABSENT
      schema:
        type: string
        enum: [ MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY ]
    syncKeyHeader:
      name: X-Sync-Key
      in: header
      required: true
      schema:
        type: string

  schemas:
    PunchRecord:
      type: object
      required:
        - empCode
        - punchTime
      properties:
        sourceId:
          type: integer
          format: int64
          description: EasyTime iclock_transaction.id
        empCode:
          type: string
        punchTime:
          type: string
          description: Factory local time, yyyy-MM-ddTHH:mm:ss (no zone)
          example: '2026-10-17T09:02:41'
        punchState:
          type: string
        verifyType:
          type: integer
        terminalSn:
          type: string
        terminalAlias:
          type: string

    PunchSyncBatch:
      type: object
      required:
        - punches
      properties:
        punches:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/PunchRecord'

    EmployeeRecord:
      type: object
      required:
        - empCode
      properties:
        empCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string

    EmployeeSyncBatch:
      type: object
      required:
        - employees
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeRecord'

    SyncResult:
      type: object
      properties:
        received:
          type: integer
        inserted:
          type: integer
          description: Rows that were new (punches) or inserted/updated (employees)

    SyncStatus:
      type: object
      properties:
        totalPunches:
          type: integer
          format: int64
        totalEmployees:
          type: integer
          format: int64
        lastPunchTime:
          type: string
          description: Latest punch the ERP has, factory local time
        lastSyncedAt:
          type: string
          description: When the ERP last received a new punch, server local time
        agentLastSeenSecondsAgo:
          type: integer
          format: int64
          description: Seconds since the factory PC last checked in (null = not since server start)

    AttendancePunch:
      type: object
      properties:
        id:
          type: integer
          format: int64
        empCode:
          type: string
        employeeName:
          type: string
        punchTime:
          type: string
        punchState:
          type: string
        verifyType:
          type: integer
        terminalSn:
          type: string
        terminalAlias:
          type: string

    AttendanceDayStatus:
      type: string
      description: |
        PRESENT = in and out punched; AT_WORK = today, punched in, not out yet (counts as present);
        MISSED_PUNCH = only one punch on a past day; ABSENT = no punch;
        WEEKLY_OFF = weekly holiday with no punch; UPCOMING = date after today;
        NOT_JOINED = before this employee's first-ever punch (new joiner)
      enum: [ PRESENT, AT_WORK, MISSED_PUNCH, ABSENT, WEEKLY_OFF, UPCOMING, NOT_JOINED ]

    DailyAttendance:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AttendanceDayStatus'
        empCode:
          type: string
        employeeName:
          type: string
        department:
          type: string
        firstIn:
          type: string
          description: HH:mm:ss of the first punch of the day
        lastOut:
          type: string
          description: HH:mm:ss of the last punch (null when only one punch)
        punchCount:
          type: integer
        workedMinutes:
          type: integer
          description: >
            Time actually worked: lastOut - firstIn less the break (the out/in gaps when there
            are 4+ punches, else the department break). Same figure as the staff profile.
        punches:
          type: array
          description: Every in/out of the day, HH:mm, in order (the hand-edited ones when manual)
          items:
            type: string
        manual:
          type: boolean
          description: The day was edited by hand in the staff profile

    AttendanceDay:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceDayStatus'
        firstIn:
          type: string
        lastOut:
          type: string
        punchCount:
          type: integer
        workedMinutes:
          type: integer
        manual:
          type: boolean

    MonthlyAttendanceRow:
      type: object
      properties:
        empCode:
          type: string
        employeeName:
          type: string
        department:
          type: string
        presentDays:
          type: integer
          description: PRESENT + AT_WORK days
        missedPunchDays:
          type: integer
        absentDays:
          type: integer
        totalWorkedMinutes:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDay'

    MonthlyAttendance:
      type: object
      properties:
        month:
          type: string
          example: '2026-10'
        daysInMonth:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyAttendanceRow'

    AttendanceEmployee:
      type: object
      properties:
        empCode:
          type: string
        employeeName:
          type: string
        department:
          type: string
        lastPunchTime:
          type: string
          description: Latest punch, factory local time (null = never punched)

    # ==================== STAFF & PAYROLL ====================
    WeekDay:
      type: string
      enum: [ MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY ]

    StaffSettings:
      type: object
      properties:
        weekStart:
          $ref: '#/components/schemas/WeekDay'
        weeklyOff:
          type: string
          description: A WeekDay, or NONE
          example: NONE

    PayMode:
      type: string
      description: How often the worker is paid
      enum: [ DAILY, WEEKLY, FIFTEEN_DAYS, MONTHLY ]

    PaymentMode:
      type: string
      enum: [ CASH, UPI, BANK_TRANSFER, CHEQUE ]

    Gender:
      type: string
      enum: [ MALE, FEMALE ]

    StaffDepartmentInput:
      type: object
      required: [ name, inTime1, outTime1 ]
      properties:
        name:
          type: string
        inTime1:
          type: string
          description: HH:mm, morning in
          example: '08:00'
        outTime1:
          type: string
          example: '12:30'
        inTime2:
          type: string
          description: HH:mm, back from break (empty = no break)
          example: '13:30'
        outTime2:
          type: string
          example: '19:20'

    StaffDepartment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inTime1:
          type: string
        outTime1:
          type: string
        inTime2:
          type: string
        outTime2:
          type: string
        breakMinutes:
          type: integer
        standardMinutes:
          type: integer
          description: Working minutes per day (both halves, break excluded)
        employeeCount:
          type: integer

    StaffProfileInput:
      type: object
      required: [ empCode, name ]
      properties:
        empCode:
          type: string
          description: The worker code on the face device
        name:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        phone:
          type: string
        aadharNo:
          type: string
        birthDate:
          type: string
          format: date
        reference:
          type: string
        joiningDate:
