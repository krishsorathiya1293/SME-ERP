name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Set deploy target
        id: target
        run: |
          echo "host=${{ secrets.PROD_EC2_IP }}" >> $GITHUB_OUTPUT
          echo "env=prod" >> $GITHUB_OUTPUT

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.target.outputs.host }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "web-app/target/web-app-1.0.0-SNAPSHOT.jar"
          target: "/tmp/"
          strip_components: 2
          debug: true

      - name: Deploy and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.target.outputs.host }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            sudo mv /tmp/web-app-1.0.0-SNAPSHOT.jar /opt/sme-erp/app.jar
            sudo chown appuser:appuser /opt/sme-erp/app.jar
            sudo systemctl restart sme-erp
            echo "Waiting for app to start..."
            for i in {1..18}; do
              STATUS=$(sudo systemctl is-active sme-erp)
              echo "Attempt $i/18 - Status: $STATUS"
              if [ "$STATUS" = "active" ]; then
                echo "App is running successfully"
                exit 0
              elif [ "$STATUS" = "failed" ]; then
                echo "App failed to start. Last logs:"
                sudo tail -30 /var/log/sme-erp/error.log
                exit 1
              fi
              sleep 10
            done
            echo "Timeout: app did not start within 3 minutes"
            sudo tail -30 /var/log/sme-erp/app.log
            exit 1

      - name: Notify success
        run: echo "Deployed to prod successfully"