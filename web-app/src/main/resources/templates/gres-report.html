<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Statement Of Outside Gris</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @page { margin: 12mm 10mm; size: A4 portrait; }

        body {
            font-family: "Kantumruy Pro", Arial, sans-serif;
            font-size: 10px;
            color: #241C17;
        }

        table.head { width: 100%; border-collapse: collapse; margin-bottom: 5mm; }
        table.head td { vertical-align: middle; }
        table.head td.logo img { height: 12mm; width: auto; }
        table.head td.tag { text-align: right; font-size: 9px; color: #7A6E5F; }
        table.head td.tag .big {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #241C17;
            letter-spacing: 0.5px;
        }
        .rule { height: 1.6mm; background: #E8A736; margin-bottom: 6mm; }

        .section { margin-bottom: 9mm; }

        .sec-title {
            background: #241C17;
            color: #FFFFFF;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 2.2mm 3mm;
            text-align: center;
        }

        table.meta { width: 100%; border-collapse: collapse; background: #FDF3E0; }
        table.meta td {
            padding: 2mm 3mm;
            font-size: 10.5px;
            border-bottom: 0.8pt solid #E2D3B4;
        }
        .meta-k { color: #7A6E5F; }
        .meta-v { font-weight: 700; color: #241C17; }

        table.data { width: 100%; border-collapse: collapse; }
        table.data th {
            background: #E8A736;
            color: #241C17;
            font-size: 10px;
            font-weight: 700;
            padding: 2mm 1.5mm;
            text-align: center;
            border: 0.6pt solid #C8871B;
        }
        table.data td {
            font-size: 10px;
            padding: 1.8mm 1.5mm;
            text-align: center;
            border: 0.6pt solid #E4DED2;
        }
        table.data tr.alt td { background: #FAF7F1; }
        table.data td.l { text-align: left; }
        table.data td.num { text-align: right; font-weight: 600; }
        .chno { font-weight: 700; color: #B87813; }

        table.data tfoot td {
            background: #241C17;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 11px;
            padding: 2.4mm 1.5mm;
            border: none;
        }
        table.data tfoot td.lbl { text-align: right; letter-spacing: 0.5px; color: #F5D9A0; }
        table.data tfoot td.kg { color: #F5D9A0; text-align: right; }
        table.data tfoot td.amt { color: #FFD98A; text-align: right; font-size: 12.5px; }

        .empty-note {
            color: #7A6E5F;
            font-style: italic;
            padding: 6mm 0;
            text-align: center;
            border: 0.8pt dashed #D8CFC0;
            background: #FAF7F1;
        }
    </style>
</head>
<body>

<table class="head">
    <tr>
        <td class="logo"><img th:src="${companyLogoMarkDataUri}" alt="Ishita Industries"/></td>
        <td class="tag">
            <span class="big">STATEMENT OF OUTSIDE GRIS</span>
            <span th:text="'Period : ' + ${#temporals.format(startDate,'dd-MM-yyyy')} + '  to  ' + ${#temporals.format(endDate,'dd-MM-yyyy')}">Period</span>
        </td>
    </tr>
</table>
<div class="rule"></div>

<div class="section" th:if="${!records.isEmpty()}">
    <div class="sec-title">Statement Of Outside Gris</div>
    <table class="meta">
        <tr>
            <td>
                <span class="meta-k">Job Worker Name :-</span>
                <span class="meta-v" th:text="${partyName}">Rajan Virani</span>
                <span style="display:inline-block; width:20mm;"></span>
                <span class="meta-k">Month :-</span>
                <span class="meta-v" th:text="${#temporals.format(startDate,'MMM-yy')}">Jul-26</span>
            </td>
        </tr>
    </table>
    <table class="data">
        <thead>
        <tr>
            <th style="width:8%;">Ch. No.</th>
            <th style="width:12%;">Date</th>
            <th style="width:26%;">Item Name</th>
            <th style="width:18%;">Size</th>
            <th style="width:12%;">Net Kg</th>
            <th style="width:10%;">Rate / Kg</th>
            <th style="width:14%;">Total Rate</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gres, gIter : ${records}" th:with="firstItem=${!gres.items.isEmpty() ? gres.items[0] : null}" th:classappend="${gIter.odd} ? '' : 'alt'">
            <td><span class="chno" th:text="${gres.chNoSerial != null ? #numbers.formatInteger(gres.chNoSerial,3) : (gres.chitthiNo != null ? gres.chitthiNo : gIter.count)}">001</span></td>
            <td th:text="${gres.chitthiDate != null ? #temporals.format(gres.chitthiDate,'d-M-yy') : '—'}"></td>
            <td class="l" th:text="${firstItem != null and firstItem.size != null and firstItem.size.item != null ? firstItem.size.item.itemName : '—'}"></td>
            <td class="l" th:text="${firstItem != null and firstItem.size != null ? firstItem.size.sizeInInch : '—'}"></td>
            <td class="num" th:text="${firstItem != null and firstItem.netWeight != null ? #numbers.formatDecimal(firstItem.netWeight,1,3) : '0.000'}"></td>
            <td class="num" th:text="${firstItem != null and firstItem.ratePerKg != null ? #numbers.formatDecimal(firstItem.ratePerKg,1,2) : '—'}"></td>
            <td class="num" th:text="${firstItem != null and firstItem.totalAmount != null ? #numbers.formatDecimal(firstItem.totalAmount,1,0) : '0'}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr th:with="
              totalNet=${#aggregates.sum(records.?[!items.isEmpty() and items[0].netWeight != null].![items[0].netWeight])},
              totalAmt=${#aggregates.sum(records.?[!items.isEmpty() and items[0].totalAmount != null].![items[0].totalAmount])}">
            <td class="lbl" colspan="4">Total</td>
            <td class="kg" th:text="${totalNet != null ? #numbers.formatDecimal(totalNet,1,3) : '0.000'}"></td>
            <td></td>
            <td class="amt" th:text="${totalAmt != null ? #numbers.formatDecimal(totalAmt,1,0) : '0'}"></td>
        </tr>
        </tfoot>
    </table>
</div>

<div class="empty-note" th:if="${records.isEmpty()}">
    No gres records found for this period.
</div>

</body>
</html>
