<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Work Chitthi - Javak</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"/>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        @page {
            margin: 0;
            size: 297.5px 420.82px;
        }

        html, body {
            width: 297.5px;
            height: 420.82px;
            background: #fff;
            overflow: hidden;
        }

        body {
            font-family: "Kantumruy Pro", Arial, sans-serif;
            font-weight: 500;
            position: relative;
            color: #111;
        }

        .ticket {
            position: absolute;
            left: 0;
            top: 0;
            width: 297.5px;
            height: 420.82px;
            padding: 18px 18px 12px 18px;
            font-size: 11px;
            line-height: 1.35;
            box-sizing: border-box;
        }

        .header {
            overflow: hidden;
            margin-bottom: 18px;
        }

        .h-left {
            float: left;
            font-size: 12px;
            font-weight: 600;
        }

        .h-right {
            float: right;
            text-align: right;
            font-size: 10px;
            color: #7e7e7e;
            line-height: 1.35;
        }

        .h-right .row {
            margin: 2px 0;
        }

        .info {
            margin-top: 8px;
        }

        .info-row {
            overflow: hidden;
            margin: 10px 0;
        }

        .lbl {
            float: left;
            width: 78px;
            color: #3a3a3a;
        }

        .val {
            float: left;
            width: 180px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-title {
            margin-top: 26px;
            font-weight: 600;
            color: #111;
        }

        .details {
            overflow: hidden;
            margin-top: 14px;
        }

        .dcol {
            float: left;
            width: 50%;
        }

        .ditem {
            margin-top: 16px;
        }

        .dlabel {
            color: #8a8a8a;
            font-size: 11px;
        }

        .dvalue {
            margin-top: 6px;
            font-size: 11px;
            color: #111;
        }
    </style>
</head>

<body>
<div class="ticket"
     th:with="
       jwNo=${job.orderItem != null && job.orderItem.jobWorkNo != null ? #numbers.formatInteger(job.orderItem.jobWorkNo,3) : ''},
       dt=${job.jobDate != null ? #temporals.format(job.jobDate,'dd-MM-yyyy') : ''},
       tm=${#temporals.format(#temporals.createNow(),'HH:mm')},
       party=${job.party != null ? job.party.name : ''},
       finish=${job.finish != null ? job.finish : ''},
       sticker=${job.orderItem != null && job.orderItem.stickerQty != null ? job.orderItem.stickerQty : ''},
       sizeText=${job.size != null ? job.size.sizeInInch : ''},
       elem=${job.elementType != null ? job.elementType.name() : ''},
       kg=${job.qtyKg != null ? job.qtyKg + 'Kg' : ''},
       pc=${job.qtyPc != null ? job.qtyPc + ' Pc.' : ''}
     ">

    <div class="header">
        <div class="h-left">Job ID - <span th:text="${jwNo}">001</span></div>
        <div class="h-right">
            <div class="row">Date: <span th:text="${dt}">03-11-2025</span></div>
            <div class="row">Time: <span th:text="${tm}">13:15</span></div>
        </div>
    </div>

    <div class="info">
        <div class="info-row">
            <div class="lbl">From :</div>
            <div class="val">Ishita Industries / इशिता इंडस्ट्रीज</div>
        </div>

        <div class="info-row">
            <div class="lbl">Party Name :</div>
            <div class="val" th:text="${party}">Maruti Brass / मारुती पीतल</div>
        </div>

        <div class="info-row">
            <div class="lbl">Finishing :</div>
            <div class="val" th:text="${finish}">SS + 16</div>
        </div>

        <div class="info-row">
            <div class="lbl">Sticker Qty. :</div>
            <div class="val" th:text="${sticker}">26</div>
        </div>
    </div>

    <div class="section-title">Javak</div>

    <div class="details">
        <div class="dcol">
            <div class="ditem">
                <div class="dlabel">Sizes</div>
                <div class="dvalue" th:text="${sizeText}">6 X 1.1/8 X 5/32 - 3.600</div>
            </div>

            <div class="ditem">
                <div class="dlabel">Kg.</div>
                <div class="dvalue" th:text="${kg}">100Kg</div>
            </div>
        </div>

        <div class="dcol">
            <div class="ditem">
                <div class="dlabel">Element</div>
                <div class="dvalue" th:text="${elem}">2P</div>
            </div>

            <div class="ditem">
                <div class="dlabel">Total Pc.</div>
                <div class="dvalue" th:text="${pc}">1250 Pc.</div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
